[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codalith"
version = "0.2.0"
description = "Local-first, versioned source intelligence for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.5,<5",
    "fastembed>=0.8.0,<1",
    "lancedb>=0.33,<1",
    "mcp<2",
    "numpy>=2.4.6,<3",
    "openai>=2.41.1,<3",
    "pathspec>=0.12,<2",
    "pyarrow>=16,<25",
    "pydantic>=2.11,<3",
    "pylance>=0.10",
    "starlette>=0.37,<2",
    "tenacity>=9.1.4,<10",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-java>=0.23.5,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.2,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.26",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
codalith = "codalith.cli.main:main"

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["codalith*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["external", ".venv", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "typings"]
exclude = ["external/", ".venv/", "build/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["numpy.*", "lancedb", "lancedb.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
follow_imports = "skip"
